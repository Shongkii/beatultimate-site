# Cloudflare Pages project config
# Deploy via Cloudflare Dashboard: connect GitHub repo, output dir = "."

name = "beatultimate-site"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# KV namespace binding is configured in Cloudflare Dashboard, not here.
# Go to: Pages project -> Settings -> Functions -> KV namespace bindings
# Variable name: BEAT_KV

# Environment variables are set in Cloudflare Dashboard:
# ADMIN_PASSWORD - admin panel login password
# CONTACT_EMAIL - contact form recipient
